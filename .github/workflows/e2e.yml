name: e2e
# 비공개 시험 저장소(ncentric-install-test)의 e2e 와 같은 시험. 시험 도구·설치 파일은 암호화 묶음(bundle.tar.enc)으로만 올리고
# 결과도 암호화(result.enc)한다. 각 단계 출력은 out/ 안 파일로 — 공개 기록에는 종료 코드만 남는다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag holding bundle.tar.enc
        required: true
      cases:
        description: JSON list of edition-variant
        default: '["nc-main","in-main","nc-upgrade","nc-stduser","in-stduser","nc-proxy","in-proxy"]'
      oses:
        description: JSON list of runner images
        default: '["windows-2022","windows-2025"]'
      winsec:
        description: Windows security on
        default: 'true'
      testsign:
        description: test-sign installers first
        default: 'false'
      hb:
        description: heartbeat to the public log every minute (elapsed, memory, cpu, process names, step id only)
        default: 'false'
permissions:
  contents: write      # 11-15 맥박 파일을 릴리스 첨부로 올리려고(hb=true 일 때만 쓴다)
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        case: ${{ fromJSON(inputs.cases) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: harness python packages
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q cryptography openpyxl reportlab pillow pymupdf *> $null; "rc=$LASTEXITCODE"
      - name: screen 1920x1080
        shell: powershell
        continue-on-error: true
        run: try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; 'ok' } catch { 'skip' }
      - name: unpack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p bundle.tar.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BUNDLE_KEY -in bundle.tar.enc | tar -x
          rm -f bundle.tar.enc; mkdir -p out; test -d ci && test -d dl && echo unpacked
      - name: test-sign installers
        if: ${{ inputs.testsign == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"; $global:LASTEXITCODE = 0
          try { ./ci/test_sign.ps1 *> out/testsign.log; $rc = $LASTEXITCODE } catch { $_ | Out-File -Append out/testsign.log; $rc = 1 }
          "rc=$rc"; exit $rc
      - name: windows security on
        if: ${{ inputs.winsec == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"; $global:LASTEXITCODE = 0
          try { ./ci/defender_on.ps1 *> out/defender_on.log; $rc = $LASTEXITCODE } catch { $_ | Out-File -Append out/defender_on.log; $rc = 1 }
          "rc=$rc"; exit $rc
      - name: e2e
        if: ${{ inputs.hb != 'true' }}
        timeout-minutes: 150
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"; $global:LASTEXITCODE = 0
          try { $c = '${{ matrix.case }}'.Split('-'); ./ci/e2e/run.ps1 -Edition $c[0] -Variant $c[1] *> out/e2e_console.log; $rc = $LASTEXITCODE } catch { $_ | Out-File -Append out/e2e_console.log; $rc = 1 }
          "rc=$rc"; exit $rc
      # 11-15: windows-2022 + Windows 보안 켬에서 작업이 멈춘 채 47분에 «runner lost communication» 으로 죽는다(기록도 사라짐).
      #   같은 시험을 자식 프로세스로 돌리고, 이 단계는 1분마다 맥박 한 줄만 공개 기록에 찍는다 — 경과·남은 메모리·CPU·상위 프로세스 이름·
      #   마지막 단계 번호·github 접속 여부. 경로·주소·사용자 이름·시험 출력은 찍지 않는다(시험 출력은 종전대로 out/ 안 파일).
      - name: e2e (heartbeat)
        if: ${{ inputs.hb == 'true' }}
        timeout-minutes: 150
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HB_TAG: ${{ inputs.tag }}
          HB_NAME: hb-${{ matrix.os }}-${{ matrix.case }}-${{ github.run_id }}.txt
        run: |
          $ErrorActionPreference = "Continue"
          $c = '${{ matrix.case }}'.Split('-')
          # 경우 이름이 idle 로 시작하면 대조: 제품·하네스를 전혀 돌리지 않고 10분 잠만 잔다(보안 켠 시험 서버만으로 멈추는지).
          #   출력은 종전 단계와 똑같이 자식 안에서 *> 로 받는다 — 밖에서 통째로 돌리면 하네스의 비밀 가림이 그 파일을 못 고쳐 rc=1(11-15).
          $cmd = if ($c[1] -like 'idle*') { 'Start-Sleep 600' } else { "& ./ci/e2e/run.ps1 -Edition $($c[0]) -Variant $($c[1]) *> out/e2e_console.log; exit `$LASTEXITCODE" }
          $t0 = Get-Date
          function Beat {
            $os = Get-CimInstance Win32_OperatingSystem
            $cpu = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
            $top = (Get-Process | Sort-Object CPU -Descending | Select-Object -First 5 | ForEach-Object { ($_.Name -replace '[^A-Za-z0-9_.-]', '?') + ':' + [int]$_.CPU }) -join ' '
            $sid = '-'; try { $m = [regex]::Matches((Get-Content out/steps.log -Tail 40 -ErrorAction Stop | Out-String), '\b[SU]\d{1,3}\b'); if ($m.Count) { $sid = $m[$m.Count - 1].Value } } catch { }
            $net = 'x'; try { $tc = New-Object Net.Sockets.TcpClient; $ar = $tc.BeginConnect('github.com', 443, $null, $null); if ($ar.AsyncWaitHandle.WaitOne(4000) -and $tc.Connected) { $net = 'ok' }; $tc.Close() } catch { }
            # 러너 프로세스가 살아 있나(기계가 굳는 것인지 러너만 죽는 것인지) · Defender 기록의 마지막 사건 번호와 최근 1분 건수(번호만).
            $run = (@('Runner.Listener', 'Runner.Worker') | ForEach-Object { if (Get-Process $_ -ErrorAction SilentlyContinue) { '1' } else { '0' } }) -join ''
            $dv = '-'; try { $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; StartTime = (Get-Date).AddSeconds(-60) } -MaxEvents 40 -ErrorAction Stop); $dv = "$($ev.Count):" + (($ev | Group-Object Id | Sort-Object Count -Descending | Select-Object -First 4 | ForEach-Object { "$($_.Name)x$($_.Count)" }) -join ',') } catch { $dv = '0' }
            $line = "hb {0}s mem={1}MB commit={7}MB disk={8}GB cpu={2}% step={3} net={4} procs={5} runner={9} def={10} top={6}" -f [int]((Get-Date) - $t0).TotalSeconds, [int]($os.FreePhysicalMemory / 1024), [int]$cpu, $sid, $net, @(Get-Process).Count, $top, [int]($os.FreeVirtualMemory / 1024), [int]((Get-PSDrive C).Free / 1GB), $run, $dv
            $line
            # 서버가 끊기면 기록·주석이 통째로 사라진다 — 맥박 파일을 릴리스 첨부로 덮어 올린다(밖에서 바로 읽힌다).
            Add-Content -Encoding ascii $env:HB_NAME ((Get-Date).ToUniversalTime().ToString('HH:mm:ss') + ' ' + $line)
            try { & gh release upload $env:HB_TAG $env:HB_NAME --clobber -R $env:GITHUB_REPOSITORY 2>&1 | Out-Null } catch { }
          }
          Beat      # 자식을 띄우기 전에 한 번 — 이 줄조차 없으면 단계 시작 전에 굳은 것
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $cmd -PassThru -NoNewWindow; $null = $p.Handle
          # 처음 4분은 20초마다(11-15 맥박 실행에서 멈춘 작업은 첫 1분 안에 굳었다), 그 뒤는 1분마다. 토큰 호출 한도(시간당 1000) 때문에 더 촘촘히는 안 한다.
          while (-not $p.HasExited) { Start-Sleep -Seconds $(if (((Get-Date) - $t0).TotalSeconds -lt 240) { 20 } else { 60 }); Beat }
          "rc=$($p.ExitCode)"; exit $p.ExitCode
      - name: windows security verdict
        if: ${{ always() && inputs.winsec == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"; $global:LASTEXITCODE = 0
          try { ./ci/defender_verdict.ps1 *> out/defender_verdict.log; $rc = $LASTEXITCODE } catch { $_ | Out-File -Append out/defender_verdict.log; $rc = 1 }
          "rc=$rc"; exit $rc
      - name: seal results
        if: always()
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: mkdir -p out && tar -c out | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BUNDLE_KEY -out result.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.case }}
          path: result.enc
